<div class="container">
  <h2 class="title">My Assigned Tasks</h2>

  <div *ngIf="loading" class="loading">Loading tasks...</div>

  <div *ngIf="!loading && tasks.length === 0" class="empty">
    No tasks assigned yet.
  </div>

  <div class="task-grid">
    <div class="task-card" *ngFor="let task of tasks">
      <div class="card-header">
        <span class="booking-id">#{{ task.bookingId }}</span>
        <span class="status assigned">{{ task.status }}</span>
      </div>

      <div class="card-body">
        <p><b>Service:</b> {{ task.serviceName }}</p>
        <p><b>Category:</b> {{ task.categoryName }}</p>
        <p><b>Date:</b> {{ task.scheduledDate }}</p>
        <p><b>Time:</b> {{ task.timeSlot }}</p>
      </div>

      <div class="card-footer">
        <button
          class="primary-btn"
          [routerLink]="['/technician/update-status', task.bookingId]"
        >
          Update Status
        </button>
      </div>
    </div>
  </div>
</div>
