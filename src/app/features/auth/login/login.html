<div class="auth-container">
  <div class="card">
    <h2>Login</h2>

    <input
      type="email"
      placeholder="Email"
      [(ngModel)]="email"
      name="email"
    />

    <input
      type="password"
      placeholder="Password"
      [(ngModel)]="password"
      name="password"
    />

    <button type="button" (click)="login()">Login</button>

    <p class="error" *ngIf="error">{{ error }}</p>

    <p class="switch">
      Don’t have an account?
      <button
        type="button"
        class="link-btn"
        routerLink="/register">
        Register
      </button>
    </p>
  </div>
</div>
