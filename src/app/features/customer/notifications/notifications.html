<div class="notification-wrapper">

  <!-- 🔔 Bell -->
  <button class="bell" (click)="toggle()" aria-label="Notifications">
    <span class="icon">🔔</span>

    <span *ngIf="unreadCount > 0" class="badge">
      {{ unreadCount }}
    </span>
  </button>

  <!-- ▼ Dropdown -->
  <div class="dropdown" *ngIf="open">

    <div class="header">
      Notifications
    </div>

    <!-- Notification items -->
    <div
      class="item"
      *ngFor="let n of notifications"
      [class.unread]="!n.read"
      (click)="markRead(n)"
    >
      <div class="title">{{ n.title }}</div>
      <div class="message">{{ n.message }}</div>
      <div class="time">{{ n.createdAt | date:'short' }}</div>
    </div>

    <!-- Empty state -->
    <div *ngIf="notifications.length === 0" class="empty">
      No notifications yet
    </div>

  </div>

</div>
