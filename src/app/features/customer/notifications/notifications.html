<div class="notification-wrapper">

  <button class="bell" (click)="toggle()">
    🔔
    <span *ngIf="unreadCount() > 0" class="badge">
      {{ unreadCount() }}
    </span>
  </button>

  <div class="dropdown" *ngIf="open">
    <div
      class="item"
      *ngFor="let n of notifications"
      [class.unread]="!n.read"
      (click)="markRead(n)"
    >
      <strong>{{ n.title }}</strong>
      <p>{{ n.message }}</p>
      <small>{{ n.createdAt | date:'short' }}</small>
    </div>

    <div *ngIf="notifications.length === 0" class="empty">
      No notifications
    </div>
  </div>

</div>
