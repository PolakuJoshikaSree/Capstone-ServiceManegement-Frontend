<h2 class="page-title">My Invoices</h2>

<div *ngIf="!loading && invoices.length === 0" class="empty-state">
  No invoices generated yet.
</div>

<div *ngIf="loading" class="loading">
  Loading invoices...
</div>

<div
  class="invoice-card"
  *ngFor="let invoice of invoices">

  <div class="invoice-row">
    <span class="label">Invoice</span>
    <span class="value">{{ invoice.invoiceNumber }}</span>
  </div>

  <div class="invoice-row">
    <span class="label">Total Amount</span>
    <span class="value">₹{{ invoice.totalAmount }}</span>
  </div>

  <div class="invoice-row status-row">

    <span
      class="status"
      [ngClass]="{
        'pending': invoice.paymentStatus === 'PENDING',
        'paid': invoice.paymentStatus === 'PAID'
      }">
      {{ invoice.paymentStatus }}
    </span>

    <button
      *ngIf="invoice.paymentStatus === 'PENDING'"
      class="pay-btn"
      (click)="payInvoice(invoice.bookingId)">
      Pay Now
    </button>

    <span
      *ngIf="invoice.paymentStatus === 'PAID'"
      class="paid-text">
      ✅ Paid
    </span>

  </div>

</div>
