<div class="my-services">

  <h2>My Services</h2>

  <!-- Loading -->
  <p *ngIf="loading">Loading your services...</p>

  <!-- Error -->
  <p class="error" *ngIf="error">{{ error }}</p>

  <!-- Empty -->
  <div *ngIf="!loading && bookings.length === 0">
    No bookings yet.
  </div>

  <!-- Booking Cards -->
  <div
    class="booking-card"
    *ngFor="let b of bookings; trackBy: trackByBookingId"
  >

    <div class="card-header">
      <h3>{{ b.serviceName }}</h3>
      <span class="status" [class]="b.status.toLowerCase()">
        {{ b.status }}
      </span>
    </div>

    <p class="category">{{ b.categoryName }}</p>
    <p class="schedule">
      {{ b.scheduledDate }} | {{ b.timeSlot }}
    </p>

    <!-- ACTIONS -->
    <div class="actions">

      <!-- Cancel -->
      <button
        class="btn cancel"
        *ngIf="b.status === 'REQUESTED' || b.status === 'ASSIGNED'"
        (click)="cancelBooking(b.bookingId)"
      >
        Cancel
      </button>

      <!-- Reschedule -->
      <button
        class="btn reschedule"
        *ngIf="b.status === 'REQUESTED' || b.status === 'ASSIGNED'"
        (click)="openReschedule(b)"
      >
        Reschedule
      </button>

    </div>

  </div>
</div>
