<div class="manager-container">
  <h2>Requested Service Bookings</h2>

  <!-- Loading -->
  <p *ngIf="loading">Loading...</p>

  <!-- Error -->
  <p class="error" *ngIf="error">{{ error }}</p>

  <!-- Empty state -->
  <div *ngIf="!loading && bookings.length === 0">
    No pending service requests
  </div>

  <!-- Booking cards -->
  <div class="booking-card" *ngFor="let b of bookings">
    <h3>{{ b.serviceName }}</h3>
    <p>{{ b.categoryName }}</p>
    <p>{{ b.scheduledDate }} | {{ b.timeSlot }}</p>
    <p><strong>Status:</strong> {{ b.status }}</p>

    <button
      class="assign-btn"
      [routerLink]="['/manager/assign', b.bookingId]"
    >
      Assign Technician
    </button>
  </div>
</div>
